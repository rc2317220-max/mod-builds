name: Preview 4 V1 exact transport capability
on:
  pull_request:
    paths:
      - '.github/workflows/preview4-fast-relink.yml'
      - 'scripts/preview4_relink_experiment.py'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview4-fast-relink-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Make room
        run: |
          rm -rf "$HOME/.rustup" "$HOME/.cargo"
          bash scripts/room.sh
      - name: Restore experimental warmed base on a different runner
        uses: actions/cache/restore@v4
        with:
          key: preview4-v1-naga-freshness-v1-45997417249-1
          fail-on-cache-miss: true
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: Verify unique timestamp survived cache archive and restore
        run: |
          cd "$HOME/store/source"
          git diff --exit-code HEAD -- third_party/naga
          python3 - <<'PY'
          import pathlib
          root = pathlib.Path("third_party/naga")
          files = [p for p in root.rglob("*") if p.is_file() and not p.is_symlink()]
          latest = max(p.stat().st_mtime_ns for p in files)
          winners = [p for p in files if p.stat().st_mtime_ns == latest]
          print("Restored newest Naga files:", winners, latest)
          assert winners == [root / "build.rs"], winners
          PY
      - name: Audit exact Android HTTP features and V1 downloader
        run: |
          set -euo pipefail
          cd "$HOME/store/source"
          test "$(git rev-parse HEAD)" = cac7bf64590fb38b4badee90f1f09848ce7f8daa
          export CARGO_HOME="$HOME/store/cargo" RUSTUP_HOME="$HOME/.rustup"
          export PATH="$CARGO_HOME/bin:$PATH"
          export CARGO_NET_OFFLINE=true
          cargo tree --offline -p sunrise-android --target aarch64-linux-android -e normal,build -f '{p} features=[{f}]' > "$GITHUB_WORKSPACE/http-feature-tree.txt"
          grep -E 'ureq v|flate2 v' "$GITHUB_WORKSPACE/http-feature-tree.txt" | sort -u
          git grep -n -I -E 'ureq[[:space:]]*=|ureq/(gzip|brotli)' -- '*Cargo.toml' > "$GITHUB_WORKSPACE/ureq-manifests.txt" || true
          cat "$GITHUB_WORKSPACE/ureq-manifests.txt"
          git show HEAD:crates/sunrise-client/src/game/starling/native_builds.rs > "$GITHUB_WORKSPACE/native_builds.rs"
          git show HEAD:crates/sunrise-client/src/starling_store.rs > "$GITHUB_WORKSPACE/starling_store.rs"
          grep -n -C 8 -E 'Accept-Encoding|Content-Encoding|into_reader|[Rr]ange|fn .*download|[Gg]zip|[Zz]std|AgentBuilder|download.*\(' "$GITHUB_WORKSPACE/native_builds.rs" "$GITHUB_WORKSPACE/starling_store.rs" > "$GITHUB_WORKSPACE/downloader-excerpts.txt" || true
          cat "$GITHUB_WORKSPACE/downloader-excerpts.txt" | tail -250
          python3 - <<'PY'
          import json, pathlib, re
          root=pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"])
          tree=(root/"http-feature-tree.txt").read_text()
          rows=sorted(set(re.findall(r"ureq v(\S+) features=\[([^\]]*)\]",tree)))
          if not rows: raise RuntimeError("no resolved HTTP library found")
          report={"ureq_resolved_features":[{"version":v,"features":f.split(",") if f else []} for v,f in rows],"gzip_feature_in_graph":any("gzip" in f.split(",") for _,f in rows),"runtime_verified":False}
          (root/"transport-capability.json").write_text(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-transport-evidence
          path: |
            http-feature-tree.txt
            ureq-manifests.txt
            native_builds.rs
            starling_store.rs
            downloader-excerpts.txt
            transport-capability.json
          if-no-files-found: warn
