name: build
run-name: build ${{ inputs.job }}
# One player's native mods, asked for through Starling's Compile service (worker/ here, on Cloudflare).
# The service keeps the mods sealed in the `requests` release under a random name; the first job opens
# them with the key in this run's inputs (scripts/unseal.sh reads it from the event and masks it) and
# compiles them in the sandbox with no network. A mod's code runs while it compiles, so that job's token
# can only read this public repository, and it writes no cache. The second job runs nothing of the mods:
# it puts the library and its status in the `results` release, where the game downloads them, or what
# went wrong, and lets the sealed mods go (scripts/publish.py).
on:
  workflow_dispatch:
    inputs:
      job:
        description: The job the game follows (the mods and the commit's hash)
        required: true
      ask:
        description: The sealed mods' name in the requests release
        required: true
      key:
        description: What opens them; never written in this file, so never in the log
        required: true
      version:
        description: A version in versions.json
        required: true
      tools:
        description: The branch of starling-client/starling with the build scripts
        default: starling
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      VERSION: ${{ inputs.version }}
      TOOLS: ${{ inputs.tools }}
      ASK: ${{ inputs.ask }}
      JOB: ${{ inputs.job }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: The commit and the scripts
        if: inputs.version != '0.9.0-preview.cac7bf6459'
        run: bash scripts/prepare.sh
      - name: Pin the original Preview 4 build
        if: inputs.version == '0.9.0-preview.cac7bf6459'
        run: echo "COMMIT=cac7bf64590fb38b4badee90f1f09848ce7f8daa" >> "$GITHUB_ENV"
      - name: Make room
        run: |
          rm -rf "$HOME/.rustup" "$HOME/.cargo"
          bash scripts/room.sh
      - uses: actions/cache/restore@v4
        if: inputs.version != '0.9.0-preview.cac7bf6459'
        with:
          key: base-${{ env.COMMIT }}
          fail-on-cache-miss: true
          path: |
            ~/.rustup
            ~/android
            ~/modbuild/cargo
            ~/modbuild/base
      - name: Restore verified Size-Z compact compiler base
        id: compact
        uses: actions/cache/restore@v4
        if: inputs.version == '0.9.0-preview.cac7bf6459'
        with:
          key: preview4-v1-size-z-cac7bf64590fb38b4badee90f1f09848ce7f8daa-arm64-v8a-v1-${{ hashFiles('scripts/preview4_whole_build.py', 'scripts/preview4_whole_base.sh', 'scripts/preview4_whole_sandbox.sh', 'scripts/preview4_jobs.sh') }}
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: Restore verified Turbo compiler base
        id: turbo
        uses: actions/cache/restore@v4
        if: inputs.version == '0.9.0-preview.cac7bf6459' && steps.compact.outputs.cache-hit != 'true'
        with:
          key: preview4-v1-turbo-cac7bf64590fb38b4badee90f1f09848ce7f8daa-arm64-v8a-${{ hashFiles('scripts/preview4_whole_build.py', 'scripts/preview4_whole_base.sh', 'scripts/preview4_whole_sandbox.sh', 'scripts/preview4_jobs.sh') }}
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: Restore previous Turbo base during cache migration
        id: previous_turbo
        uses: actions/cache/restore@v4
        if: inputs.version == '0.9.0-preview.cac7bf6459' && steps.compact.outputs.cache-hit != 'true' && steps.turbo.outputs.cache-hit != 'true'
        with:
          key: preview4-v1-turbo-cac7bf64590fb38b4badee90f1f09848ce7f8daa-arm64-v8a-3c2bda13fb4176ca33639ea8516a1991304e11765849d91e0d5046b78fa6ac34
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: Restore original compiler base (fallback)
        uses: actions/cache/restore@v4
        if: inputs.version == '0.9.0-preview.cac7bf6459' && steps.compact.outputs.cache-hit != 'true' && steps.turbo.outputs.cache-hit != 'true' && steps.previous_turbo.outputs.cache-hit != 'true'
        with:
          key: preview4-v1-static-cac7bf64590fb38b4badee90f1f09848ce7f8daa-arm64-v8a-v1
          fail-on-cache-miss: true
          path: |
            ~/.rustup
            ~/android
            ~/store/source
            ~/store/cargo
      - name: The mods
        run: bash scripts/unseal.sh
      - name: Build
        if: inputs.version != '0.9.0-preview.cac7bf6459'
        env:
          MOD_BUILD_SECONDS: '3200'
        run: python3 tools/mod_build_once.py mods.bin "$COMMIT" result
      - name: Compile Preview 4 whole game for the original APK
        if: inputs.version == '0.9.0-preview.cac7bf6459'
        env:
          COMPACT_CACHE_HIT: ${{ steps.compact.outputs.cache-hit }}
          TURBO_CACHE_HIT: ${{ steps.turbo.outputs.cache-hit }}
        run: |
          echo "Verified Size-Z cache: $COMPACT_CACHE_HIT; verified Turbo cache: $TURBO_CACHE_HIT"
          # Both caches must use the current loader, not the obsolete legacy implementation.
          bash scripts/preview4_whole_sandbox.sh mods.bin result
          # Refuse publication if a successful build lacks the current compiler's metrics.
          if [ -f result/status.json ] && jq -e '.state == "done"' result/status.json >/dev/null; then
            test -s result/compile-metrics.json
          fi
          if [ -f result/compile-metrics.json ]; then cat result/compile-metrics.json; fi
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result/
          retention-days: 1
          compression-level: 1
          if-no-files-found: error
  publish:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      JOB: ${{ inputs.job }}
      ASK: ${{ inputs.ask }}
      BUILT: ${{ needs.build.result }}
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        if: needs.build.result == 'success'
        continue-on-error: true
        with:
          name: result
          path: result/
      - name: Prepare Preview 4 result shard
        if: inputs.version == '0.9.0-preview.cac7bf6459'
        run: |
          set -euo pipefail
          [[ "$JOB" =~ ^[0-9a-f]{24}$ ]]
          tag="results-${JOB:0:1}"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --target main --prerelease --title "$tag" --notes 'Native build results' || gh release view "$tag" >/dev/null
          fi
      - name: The answer
        run: python3 scripts/publish.py
